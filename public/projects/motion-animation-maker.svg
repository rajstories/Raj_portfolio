      <circle cx="160" cy="35" r="78" fill="url(#lime)" opacity=".18"/>
      <rect x="25" y="38" width="72" height="30" rx="5" fill="#b7f431"/>
      <text x="61" y="59" fill="#162000" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900">₹80,000</text>
      <text x="25" y="139" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="900">4 Ps</text>
      <text x="25" y="184" fill="#b7f431" font-family="Arial, sans-serif" font-size="31" font-weight="900">MARKETING</text>
