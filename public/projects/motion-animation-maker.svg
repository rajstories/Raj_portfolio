<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Motion Animation Maker</title>
  <desc id="desc">Three premium vertical reel concepts inside a programmatic motion studio interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b13"/>
      <stop offset="1" stop-color="#12182a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8f6aff"/>
      <stop offset="1" stop-color="#5335d8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d83ff"/>
      <stop offset="1" stop-color="#1a3dad"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c6ff38"/>
      <stop offset="1" stop-color="#72b900"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1108" cy="74" r="178" fill="#315ef8" opacity=".12"/>
  <circle cx="90" cy="674" r="230" fill="#8c52ff" opacity=".09"/>

  <g transform="translate(62 56)">
    <rect width="338" height="46" rx="23" fill="#171d2e" stroke="#343d59"/>
    <circle cx="25" cy="23" r="6" fill="#ff5a2a"/>
    <text x="45" y="29" fill="#dfe5ff" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">PROGRAMMATIC MOTION STUDIO</text>
  </g>

  <text x="64" y="158" fill="#fff" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Motion Animation</text>
  <text x="64" y="220" fill="#9f83ff" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Maker</text>
  <text x="68" y="264" fill="#9ea9c3" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1.4">VOICE-SYNCED TYPOGRAPHY · REUSABLE SCENES · VERIFIED OUTPUT</text>

  <g filter="url(#shadow)">
    <g transform="translate(80 315) rotate(-4 95 171)">
