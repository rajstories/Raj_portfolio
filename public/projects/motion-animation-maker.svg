  <g transform="translate(784 329)">
    <text fill="#7f8ba7" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.5">ENGINEERING METRICS</text>
    <g transform="translate(0 35)">
      <rect width="420" height="78" rx="18" fill="#151b2b" stroke="#2c3650"/>
      <text x="25" y="49" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="900">50</text>
      <text x="92" y="46" fill="#aeb8cf" font-family="Arial, sans-serif" font-size="16" font-weight="700">VOICE-TIMED VISUAL EVENTS</text>
    </g>
    <g transform="translate(0 128)">
      <rect width="420" height="78" rx="18" fill="#151b2b" stroke="#2c3650"/>
      <text x="25" y="49" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="900">279</text>
      <text x="112" y="46" fill="#aeb8cf" font-family="Arial, sans-serif" font-size="16" font-weight="700">WORD-LEVEL TIMESTAMPS</text>
    </g>
    <g transform="translate(0 221)">
      <rect width="420" height="78" rx="18" fill="#151b2b" stroke="#2c3650"/>
      <text x="25" y="49" fill="#b7f431" font-family="Arial, sans-serif" font-size="34" font-weight="900">83/83</text>
      <text x="141" y="46" fill="#aeb8cf" font-family="Arial, sans-serif" font-size="16" font-weight="700">AUTOMATED QA CHECKS</text>
    </g>
  </g>

  <g transform="translate(784 652)">
    <rect width="182" height="38" rx="19" fill="#fff"/>
    <text x="91" y="25" fill="#111522" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800">1080 × 1920 · 30 FPS</text>
    <rect x="196" width="132" height="38" rx="19" fill="#7957ed"/>
    <text x="262" y="25" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800">REMOTION 4</text>
  </g>
</svg>
