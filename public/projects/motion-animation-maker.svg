        <rect width="140" height="32" rx="5" fill="#151b16"/>
        <text x="12" y="22" fill="#dce9cf" font-family="Arial, sans-serif" font-size="13" font-weight="700">PRODUCT · PRICE</text>
        <rect y="43" width="140" height="32" rx="5" fill="#151b16"/>
        <text x="12" y="65" fill="#dce9cf" font-family="Arial, sans-serif" font-size="13" font-weight="700">PLACE · PROMOTION</text>
