    <g transform="translate(292 296)">
      <rect width="204" height="368" rx="26" fill="#050812" stroke="#426cff" stroke-width="3"/>
      <circle cx="176" cy="15" r="80" fill="url(#blue)" opacity=".33"/>
      <text x="102" y="136" fill="#bdc7db" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3">WELCOME TO</text>
      <text x="102" y="179" fill="#4d83ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900">SYSTEM 01</text>
