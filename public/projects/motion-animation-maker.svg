      <circle cx="142" cy="64" r="75" fill="url(#violet)" opacity=".25"/>
      <text x="25" y="98" fill="#111522" font-family="Arial, sans-serif" font-size="20" font-weight="700">OPENAI</text>
      <text x="24" y="153" fill="#7957ed" font-family="Arial, sans-serif" font-size="56" font-weight="900">$100</text>
      <text x="24" y="204" fill="#111522" font-family="Arial, sans-serif" font-size="49" font-weight="900">FREE</text>
      <rect x="24" y="228" width="137" height="36" rx="5" fill="#111522"/>
      <text x="38" y="252" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1">CODEX CREDITS</text>
      <rect x="24" y="290" width="66" height="6" rx="3" fill="#8f6aff"/>
      <rect x="98" y="290" width="39" height="6" rx="3" fill="#d8d1ef"/>
